function polyDivide(A, B, v) {
  let rem = A.clone(), q = Poly.c(0); const steps = [];
  const db = B.degree(v), lb = B.lead(v);
  let guard = 0;
  while (!rem.isZero() && rem.degree(v) >= db && guard++ < 12) {
    const dr = rem.degree(v), lc = rem.lead(v);
    const t = Poly.mono(lc.div(lb), { [v]: dr - db });
    const prod = B.mul(t); const nr = rem.sub(prod);
    steps.push({ qt: t, prod, rem: nr }); q = q.add(t); rem = nr;
  }
  return { q, r: rem, steps };
}

  else if (lvl === 2) { B = Mo(1, { [v]: 1 }).add(K(k)); Q = Mo(r.nz(1, 3), { [v]: 2 }).add(Mo(r.nz(-6, 6), { [v]: 1 })).add(K(r.nz(-8, 8))); rmd = r.pick([0, r.nz(-9, 9), r.nz(-9, 9)]); }
  else { B = Mo(r.pick([2, 3]), { [v]: 1 }).add(K(r.nz(-5, 5))); Q = Mo(r.nz(1, 3), { [v]: 2 }).add(Mo(r.nz(-5, 5), { [v]: 1 })).add(K(r.nz(-6, 6))); rmd = r.pick([0, r.nz(-9, 9)]); }
  const A = B.mul(Q).add(K(rmd));
  const dv = polyDivide(A, B, v);
  const stepsTxt = dv.steps.map((s, i) => 'Paso ' + (i + 1) + ': ' + M(fs(s.qt)) + ' → multiplicamos ' + M(fs(s.qt) + '·' + par(B) + ' = ' + fs(s.prod)) + ' y restamos: queda ' + M(fs(s.rem)));

  if (geo) {

      hints: ['Área = base × altura, así que el otro lado es el área ÷ el lado conocido.', 'Divide el polinomio del área entre ' + fs(B) + ' con división larga.', common.hints[2]],
      solution: ['Como Área = base × altura, altura = Área ÷ base.'].concat(solution.slice(0, -1), ['El otro lado mide ' + MP(dv.q) + '.']), answer: MP(dv.q), fallbackTag: 'división' }));

function g_perimetro(r, lvl) {
  const v = r.pick(['x', 'x', 'a', 'm', 'n']);

  const mono = () => Mo(r.int(1, 4), { [v]: 1 });

  let sides, pts, name, expr;
  if (shape === 'tri') { sides = [lin(), r.chance(0.5) ? mono() : lin(), lin()]; pts = SHAPES.tri; name = 'triángulo'; }
  else if (shape === 'rect') { const b = lin(), h = Mo(r.int(1, 3), { [v]: 1 }).add(K(r.int(-4, 6))); sides = [b, h, b, h]; pts = SHAPES.rect; name = 'rectángulo'; }
  else if (shape === 'pent') { sides = [mono(), lin(), Mo(r.int(2, 4), { [v]: 1 }).add(K(-r.int(1, 5))), mono(), lin()]; pts = SHAPES.pent; name = 'pentágono irregular'; }
  else { sides = [lin(), lin(), mono(), Mo(r.int(1, 3), { [v]: 1 }).add(K(-r.int(1, 5)))]; pts = SHAPES.quad; name = 'cuadrilátero'; }
  const total = Poly.sum(sides);

    fallback: 'Suma todos los lados (cuenta cada lado, aunque se repita) y reduce términos semejantes.' });
}

function g_signos(r, lvl) {

function g_distributiva(r, lvl) {

  const ms = [];
  for (let i = 0; i < n; i++) ms.push(g.mul(Mo(r.int(1, 4), Object.fromEntries(vars.map((q) => [q, r.int(0, 3)]).filter((x) => x[1] > 0)))));

  if (lvl === 1) { A = Mo(1, { [v]: r.pick([1, 1, 2]) }); B = K(r.int(1, 12)); if (r.chance(0.2)) { const t = A; A = B; B = t; } }
  else if (lvl === 2) { A = Mo(r.int(2, 9), { [p]: r.pick([1, 2]) }); B = Mo(r.int(1, 9), { [q]: r.pick([1, 2, 3]) }); if (gcd(A.terms()[0].c.n, B.terms()[0].c.n) > 1) B = Mo(1, { [q]: 2 }); }
  else { A = Mo(r.int(1, 5), { [v]: r.pick([1, 2]) }); B = K(r.int(1, 9)); if (gcd(A.terms()[0].c.n, B.terms()[0].c.n) > 1) B = K(1); gcf = r.pick([Mo(r.int(2, 5), {}), Mo(r.int(2, 4), { [v]: 1 }), Mo(1, { [v]: 1 })]); if (gcf.terms()[0].c.n === 1 && !Object.keys(gcf.terms()[0].e).length) gcf = Mo(3, {}); }
  const F1 = A.sub(B), F2 = A.add(B);
  let poly = F1.mul(F2), factors = [F1, F2];
  if (gcf) { poly = poly.mul(gcf); factors = [gcf, F1, F2]; }
  if (poly.terms().length < 2 || canFactorMore(F1) || canFactorMore(F2)) return g_difCuadrados(r, lvl, opts);
  // gcf con la letra: si gcf tiene v y A tiene v, todo bien
  const steps = gcf ? ['Primero el factor común: ' + M(fs(poly) + ' = ' + fs(gcf) + '(' + fs(F1.mul(F2)) + ')'), 'Dentro del paréntesis hay una diferencia de cuadrados: ' + M('(' + fs(A) + ')^2 ' + MINUS + ' (' + fs(B) + ')^2'), 'Se factoriza como (a + b)(a − b): ' + M(fs(gcf) + par(F2) + par(F1))]
    : ['Es una diferencia de cuadrados: ' + M(fs(A.mul(A)) + ' = (' + fs(A) + ')^2') + ' y ' + M(fs(B.mul(B)) + ' = (' + fs(B) + ')^2'), 'Se factoriza como (a + b)(a − b): ' + M(par(F2) + par(F1)), 'Comprobamos multiplicando de regreso: ' + M(par(F2) + par(F1) + ' = ' + fs(poly))];
  return mkFactorProblem({ poly, factors, instr: 'Factoriza <b>completamente</b>.', expr: M(fs(poly)), vars: [v, p, q], fallbackTag: 'tipo de factorización', factorTag: 'tipo de factorización',
    hints: gcf ? ['Antes de nada, ¿hay un factor común en todos los términos?', 'Después de sacarlo, mira lo que queda: ¿es una resta de cuadrados perfectos?', 'Saca ' + fs(gcf) + '; queda ' + fs(F1.mul(F2)) + '.'] : ['Es una resta (no suma) de dos términos que son cuadrados perfectos.', 'Saca la raíz cuadrada de cada término: ' + fs(A) + ' y ' + fs(B) + '.', 'Escribe (a + b)(a − b) con a = ' + fs(A) + ' y b = ' + fs(B) + '.'],
    solution: steps, answer: M(factors.map(par).join('')), fallback: 'Diferencia de cuadrados: a² − b² = (a + b)(a − b). Si hay factor común, sácalo primero.' });
}

function g_tcp(r, lvl, opts) {
  opts = opts || {};
  const v = r.pick(['x', 'x', 'x', 'a', 'y', 'm', 't']); const [p, q] = twoVars(r);
  if (opts.mc) {
    const isTcp = r.chance(0.5); const c = r.int(2, 9);
    let poly;
    if (isTcp) { const s = r.pick([1, -1]); poly = Mo(1, { [v]: 1 }).add(K(s * c)).mul(Mo(1, { [v]: 1 }).add(K(s * c))); }
    else { const mode = r.pick(['mid', 'last']); const s = r.pick([1, -1]); if (mode === 'mid') poly = Mo(1, { [v]: 2 }).add(Mo(s * (2 * c + r.int(1, 3)), { [v]: 1 })).add(K(c * c)); else poly = Mo(1, { [v]: 2 }).add(Mo(s * 2 * c, { [v]: 1 })).add(K(-c * c)); }
    const ex = isTcp; const why = ex ? 'Sí: el primer y último términos son cuadrados perfectos y el del medio es el doble producto de sus raíces.' : 'No: para ser trinomio cuadrado perfecto, el término del medio debe ser el doble producto de las raíces y los extremos deben ser cuadrados positivos.';
    return P({ kind: 'choice', dim: 'reconoce', instr: '¿Es un <b>trinomio cuadrado perfecto</b>?', expr: MP(poly), options: yesNo(ex, why, why),
      hints: ['Revisa el primer y el último término: ¿son cuadrados perfectos?', 'Después saca sus raíces y calcula el doble producto: ¿coincide con el término del medio?', 'Deben cumplirse las dos condiciones a la vez.'],
      solution: [why], answer: ex ? 'Sí' : 'No', fallbackTag: 'tipo de factorización', fallback: why });
  }
  let A, B;
  if (lvl === 1) { A = Mo(1, { [v]: 1 }); B = K(r.pick([1, -1]) * r.int(1, 9)); }
  else if (lvl === 2) { let a, c; do { a = r.int(2, 5); c = r.int(1, 7); } while (gcd(a, c) > 1); A = Mo(a, { [v]: 1 }); B = K(r.pick([1, -1]) * c); }
  else { let a, c; do { a = r.int(1, 3); c = r.int(1, 5); } while (gcd(a, c) > 1); A = Mo(a, { [p]: 1 }); B = Mo(r.pick([1, -1]) * c, { [q]: 1 }); if (r.chance(0.3)) { A = Mo(a, { [p]: 2 }); B = K(r.pick([1, -1]) * c); } }
  const F = A.add(B); if (canFactorMore(F)) return g_tcp(r, lvl, opts); const poly = F.mul(F);
  return mkFactorProblem({ poly, factors: [F, F], instr: 'Factoriza este <b>trinomio cuadrado perfecto</b>.', expr: MP(poly), vars: [v, p, q], fallbackTag: 'tipo de factorización', factorTag: 'tipo de factorización',
    hints: ['El primer y el último término son cuadrados perfectos.', 'Saca la raíz cuadrada de esos dos términos: serán los términos del binomio.', 'Raíces: ' + fs(A) + ' y ' + fs(B.abs ? B : B) + ' (el signo lo decide el término del medio).'],
    solution: ['Raíz del primer término: ' + M(fs(A)) + ' ; raíz del último: ' + M(fs(B.terms()[0].c.n < 0 ? B.neg() : B)), 'El término del medio es el doble producto: ' + M(fs(A.mul(B).scale(new Fr(2)))) + ', con signo ' + (B.terms()[0].c.n < 0 ? '−' : '+') + '.', 'Factorizamos: ' + M(par(F) + '^2'), 'Comprobamos: ' + M(par(F) + '^2 = ' + fs(poly))], answer: M(par(F) + '^2'),
    fallback: 'TCP: a² ± 2ab + b² = (a ± b)². Saca las raíces de los extremos y usa el signo del término del medio.' });
}

function g_trinomio1(r, lvl) {
  const v = r.pick(['x', 'x', 'x', 'a', 'y', 'm', 't', 'w']);
  let p, q;
  for (;;) {
    if (lvl === 1) { p = r.int(1, 9); q = r.int(1, 9); }
    else if (lvl === 2) { p = r.nz(-9, 9); q = r.nz(-9, 9); }
    else { p = r.nz(-12, 12); q = r.nz(-12, 12); }
    if (p + q !== 0 && (lvl !== 1 || p !== q) && p !== q) break;
    if (p === q && lvl >= 2 && r.chance(0.15)) { if (p + q !== 0) break; }
  }
  const F1 = Mo(1, { [v]: 1 }).add(K(p)), F2 = Mo(1, { [v]: 1 }).add(K(q));
  const poly = F1.mul(F2);
  const b = p + q, c = p * q;
  return mkFactorProblem({ poly, factors: [F1, F2], instr: 'Factoriza este trinomio.', expr: MP(poly), vars: [v], fallbackTag: 'tipo de factorización', factorTag: 'tipo de factorización',
    hints: ['Busca dos números que <b>multiplicados</b> den ' + c + ' y <b>sumados</b> den ' + b + '.', 'Prueba pares de factores de ' + Math.abs(c) + ' y fíjate en cuál suma ' + b + '.', 'Piensa en ' + p + ' y en otro número…'],
    solution: ['Buscamos dos números que multiplicados den ' + c + ' y sumados den ' + b + ': ' + M(String(p < 0 ? '(' + p + ')' : p) + ' y ' + (q < 0 ? '(' + q + ')' : q)) + '.', 'Comprobamos: ' + M(p + '·' + (q < 0 ? '(' + q + ')' : q) + ' = ' + c + ' ;  ' + p + ' + ' + (q < 0 ? '(' + q + ')' : q) + ' = ' + b), 'Factorizado: ' + M(par(F1) + par(F2))], answer: M(par(F1) + par(F2)),
    fallback: 'Busca dos números que multiplicados den el término independiente y sumados den el coeficiente de x.' });
}

function g_trinomio2(r, lvl) {
  const v = r.pick(['x', 'x', 'x', 'a', 'y', 'm', 't', 'w']);
  let pa, qa, ra, sa, tries = 0;
  for (;;) {
    tries++;
    const mx = lvl === 1 ? 3 : lvl === 2 ? 4 : 6, mq = lvl === 1 ? 4 : lvl === 2 ? 6 : 8;
    pa = r.int(1, mx); ra = r.int(1, mx); qa = r.nz(-mq, mq); sa = r.nz(-mq, mq);
    if (pa === 1 && ra === 1) continue;
    if (gcd(pa, Math.abs(qa)) !== 1 || gcd(ra, Math.abs(sa)) !== 1) continue;
    const mid = pa * sa + qa * ra;
    if (mid === 0) continue;
    if (pa === ra && qa === sa) continue;
    if (tries > 500) { pa = 2; ra = 1; qa = 1; sa = -3; }
    break;
  }
  const F1 = Mo(pa, { [v]: 1 }).add(K(qa)), F2 = Mo(ra, { [v]: 1 }).add(K(sa));
  const poly = F1.mul(F2);
  const a_ = pa * ra, c_ = qa * sa, b_ = pa * sa + qa * ra;
  return mkFactorProblem({ poly, factors: [F1, F2], instr: 'Factoriza este trinomio.', expr: MP(poly), vars: [v], fallbackTag: 'tipo de factorización', factorTag: 'tipo de factorización',
    hints: ['Piensa en dos binomios: los primeros términos multiplican a ' + M(fs(Mo(a_, { [v]: 2 }))) + ' y los últimos a ' + c_ + '.', 'Prueba combinaciones y revisa la suma de los productos «medio por medio» y «extremo por extremo»: debe dar ' + M(fs(Mo(b_, { [v]: 1 }))) + '.', 'Prueba con ' + M('(' + fs(Mo(pa, { [v]: 1 })) + ' ...)(' + fs(Mo(ra, { [v]: 1 })) + ' ...)') + '.'],
    solution: ['Factores de ' + a_ + ': ' + M(pa + v + ' y ' + ra + v) + ' ; factores de ' + c_ + ': ' + qa + ' y ' + sa, 'Probamos: ' + M(par(F1) + par(F2)) + '. Producto extremos + medios: ' + M(fs(Mo(pa * sa, { [v]: 1 })) + ' + ' + fs(Mo(qa * ra, { [v]: 1 })) + ' = ' + fs(Mo(b_, { [v]: 1 }))) + ' ✓', 'Factorizado: ' + M(par(F1) + par(F2))], answer: M(par(F1) + par(F2)),
    fallback: 'Prueba combinaciones de factores de a y de c hasta que los productos cruzados sumen el término del medio.' });
}

function g_cubos(r, lvl) {
  const v = r.pick(['x', 'x', 'x', 'a', 'y', 'm', 'w']); const [p, q] = twoVars(r);
  let A, B; const sum = r.chance(0.5);
  if (lvl === 1) { A = Mo(1, { [v]: 1 }); B = K(r.int(1, 6)); }
  else if (lvl === 2) { A = Mo(r.pick([1, 2, 3, 4, 5]), { [v]: 1 }); B = r.chance(0.5) ? K(r.int(1, 4)) : Mo(1, { [q]: 1 }); if (gcd(A.terms()[0].c.n, B.terms()[0].c.n) > 1) B = K(1); }
  else { A = Mo(r.pick([2, 3, 4]), { [p]: 1 }); B = Mo(r.pick([1, 3, 5]), { [q]: 1 }); if (gcd(A.terms()[0].c.n, B.terms()[0].c.n) > 1) B = Mo(1, { [q]: 1 }); }
  const F1 = sum ? A.add(B) : A.sub(B);
  const F2 = A.mul(A).add(sum ? A.mul(B).neg() : A.mul(B)).add(B.mul(B));
  const poly = F1.mul(F2);
  const cubeA = A.pow(3), cubeB = B.pow(3);
  return mkFactorProblem({ poly, factors: [F1, F2], instr: 'Factoriza esta ' + (sum ? '<b>suma</b>' : '<b>diferencia</b>') + ' de cubos.', expr: MP(poly), vars: [v, p, q], fallbackTag: 'tipo de factorización', factorTag: 'tipo de factorización',
    hints: ['Cada término es un cubo perfecto. Saca la raíz cúbica de cada uno.', 'Primer factor: la ' + (sum ? 'suma' : 'resta') + ' de las raíces. Segundo factor: cuadrado de la primera − (o +) producto + cuadrado de la segunda.', 'Raíces cúbicas: ' + fs(A) + ' y ' + fs(B) + '. Primer factor: ' + par(F1)],
    solution: ['Raíces cúbicas: ' + M(fs(cubeA) + ' = (' + fs(A) + ')^3') + ' y ' + M(fs(cubeB) + ' = (' + fs(B) + ')^3'), 'Primer factor: ' + M(par(F1)), 'Segundo factor: ' + M('(' + fs(A) + ')^2 ' + (sum ? MINUS : '+') + ' (' + fs(A) + ')(' + fs(B) + ') + (' + fs(B) + ')^2 = ' + fs(F2)), 'Factorizado: ' + M(par(F1) + par(F2))], answer: M(par(F1) + par(F2)),
    fallback: 'a³ ± b³ = (a ± b)(a² ∓ ab + b²). El signo del primer factor es el del binomio; en el trinomio el signo del medio es el contrario.' });
}

function g_metodoFact(r, lvl) {
  const kinds = ['fc', 'dc', 'tcp', 't1', 't2', 'cubos'];
  const labels = { fc: 'Factor común', dc: 'Diferencia de cuadrados', tcp: 'Trinomio cuadrado perfecto', t1: 'Trinomio x² + bx + c', t2: 'Trinomio ax² + bx + c', cubos: 'Suma o diferencia de cubos' };
  const k = r.pick(kinds);
  const sd = r.int(1, 1e9);
  let base;
  switch (k) { case 'fc': base = g_factorComun(RNG(sd), 1); break; case 'dc': base = g_difCuadrados(RNG(sd), 1); break; case 'tcp': base = g_tcp(RNG(sd), 1); break; case 't1': base = g_trinomio1(RNG(sd), 1); break; case 't2': base = g_trinomio2(RNG(sd), 1); break; default: base = g_cubos(RNG(sd), 1); }
  const wrongKinds = r.shuffle(kinds.filter((x) => x !== k)).slice(0, 3);
  const opts = r.shuffle([k].concat(wrongKinds)).map((x) => ({ h: labels[x], ok: x === k, fb: 'No: este se factoriza con «' + labels[k] + '».', tag: 'tipo de factorización' }));
  const cue = {
    fc: 'Todos los términos comparten un número o una letra.', dc: 'Es una resta de dos cuadrados perfectos.', tcp: 'Los extremos son cuadrados perfectos y el del medio es el doble producto de sus raíces.',
    t1: 'Tiene la forma x² + bx + c, con coeficiente 1 en x².', t2: 'Tiene la forma ax² + bx + c, con a distinto de 1.', cubos: 'Es una suma o resta de dos cubos perfectos.',
  };
  return P({ kind: 'choice', dim: 'reconoce', instr: '¿Qué método de factorización usarías para este polinomio?', expr: base.expr, options: opts,
    hints: ['Cuenta los términos: ¿dos o tres?', 'Con dos términos: ¿hay factor común, resta de cuadrados o de cubos? Con tres: ¿es cuadrado perfecto?', 'Pista clave: ' + cue[k]],
    solution: [cue[k] + ' → ' + labels[k] + '.'], answer: labels[k], fallbackTag: 'tipo de factorización', fallback: 'Fíjate en el número de términos y en la forma del polinomio.' });
}

// ---- preguntas de comprensión (¿por qué funciona?)
const WHY = {
  semejantes: [
    { q: '¿Por qué <b>3x²</b> y <b>5x</b> no se pueden sumar en un solo término?', ok: 'Porque no tienen la misma parte literal (x² y x son distintas).', bad: ['Porque 3 y 5 son números distintos.', 'Porque el resultado sería demasiado grande.', 'Porque solo se suman términos con coeficiente igual.'] },
    { q: 'Al reducir <b>4x² + 3x²</b> obtenemos <b>7x²</b>. ¿Por qué el exponente no cambia?', ok: 'Porque sumamos «cuántas x²» hay; la parte literal x² es la misma.', bad: ['Porque los exponentes siempre se quedan igual.', 'Porque 2 + 2 = 4.', 'Porque el exponente se suma solo al multiplicar.'] },
  ],
  resta: [{ q: 'En <b>(5x + 2) − (3x − 4)</b>, ¿por qué el −4 se convierte en +4?', ok: 'Porque el signo − delante del paréntesis cambia el signo de todos los términos de adentro.', bad: ['Porque los números negativos siempre pasan a positivos.', 'Porque se resta 4 dos veces.', 'Porque el 2 es positivo.'] }],
  agrupacion: [{ q: '¿Qué significa un signo <b>−</b> delante de un paréntesis?', ok: 'Que hay que cambiar el signo de cada término que está adentro.', bad: ['Que el paréntesis se puede ignorar.', 'Que solo cambia el primer término.', 'Que se multiplica por 2.'] }],
  divMon: [{ q: 'En <b>x⁵ ÷ x²</b>, ¿por qué el resultado es x³?', ok: 'Porque se tachan 2 letras x de arriba y de abajo, y quedan 5 − 2 = 3.', bad: ['Porque 5 ÷ 2 = 2.5 y se redondea.', 'Porque los exponentes se suman.', 'Porque x²  se multiplica por x⁵.'] }],
  exponentes: [
    { q: '¿Por qué <b>x² · x³ = x⁵</b>?', ok: 'Porque x·x · x·x·x tiene 5 letras x multiplicadas.', bad: ['Porque 2 × 3 = 6, y se resta 1.', 'Porque así lo dice la regla y no se puede explicar.', 'Porque los exponentes se multiplican.'] },
    { q: '¿Por qué <b>(x²)³ = x⁶</b>?', ok: 'Porque son 3 grupos de x², es decir 3 × 2 = 6 letras x.', bad: ['Porque 2 + 3 = 5 y se suma 1.', 'Porque la potencia solo afecta al 3.', 'Porque (x²)³ = x²·3.'] },
  ],
  signos: [{ q: '¿Por qué <b>(−2)³ = −8</b>?', ok: 'Porque hay tres factores negativos (cantidad impar), y el resultado conserva el signo −.', bad: ['Porque el exponente siempre vuelve negativo el resultado.', 'Porque 2³ = 8 y el signo no importa.', 'Porque (−2)·3 = −6.'] }],
  distributiva: [{ q: 'En <b>3(x + 4) = 3x + 12</b>, ¿por qué el 3 también multiplica al 4?', ok: 'Porque el 3 multiplica a <b>todo</b> lo que hay dentro del paréntesis, término por término.', bad: ['Porque el 4 es más grande que el 3.', 'Porque solo multiplica al primer término.', 'Porque los números siempre se multiplican entre sí.'] }],
  multPol: [{ q: 'Al multiplicar <b>(x + 2)(x + 5)</b>, ¿cuántos productos parciales aparecen?', ok: '4: cada término del primer paréntesis por cada término del segundo.', bad: ['2: x·x y 2·5.', '3: uno por cada signo.', '1: solo el producto total.'] }],
  cuadrado: [
    { q: '¿Por qué <b>(x + 4)² no es x² + 16</b>?', ok: 'Porque (x+4)(x+4) produce también dos productos 4x y 4x, que forman el término del medio 8x.', bad: ['Porque 4² = 8.', 'Porque el cuadrado solo afecta a la x.', 'Porque no se puede elevar un binomio al cuadrado.'] },
    { q: 'En <b>(x + 3)² = x² + 6x + 9</b>, ¿de dónde sale el 6x?', ok: 'De sumar los dos rectángulos 3x + 3x del modelo de áreas.', bad: ['De multiplicar 3 × 2 × x.', 'De sumar 3 + 3 sin la x.', 'De elevar 3 al cuadrado.'] },
  ],
  conjugados: [{ q: '¿Por qué <b>(x + 5)(x − 5) = x² − 25</b> no tiene término con x?', ok: 'Porque los productos cruzados −5x y +5x se cancelan.', bad: ['Porque 5 − 5 = 0 antes de multiplicar.', 'Porque la x desaparece al multiplicar.', 'Porque solo se multiplican los primeros términos.'] }],
  cubo: [{ q: '¿Por qué <b>(x + 2)³ no es x³ + 8</b>?', ok: 'Porque al multiplicar tres veces aparecen otros productos intermedios (6x² y 12x).', bad: ['Porque 2³ = 6.', 'Porque el cubo solo afecta a la x.', 'Porque un binomio no se puede elevar al cubo.'] }],
  factorComun: [{ q: '¿Cómo compruebas que <b>3x(x + 4)</b> es la factorización correcta de <b>3x² + 12x</b>?', ok: 'Multiplicando de regreso: 3x·x + 3x·4 debe dar 3x² + 12x.', bad: ['Sumando 3x + x + 4.', 'Dividiendo 3x² + 12x entre 12.', 'No hay forma de comprobarlo.'] }],
  difCuadrados: [{ q: '¿Por qué <b>x² + 25</b> no se factoriza como diferencia de cuadrados?', ok: 'Porque es una suma: sus factores conjugados darían x² − 25, no x² + 25.', bad: ['Porque 25 no es un cuadrado perfecto.', 'Porque tiene demasiados términos.', 'Porque la x está al cuadrado.'] }],
  trinomio1: [{ q: 'Al factorizar <b>x² + 7x + 10</b> buscamos dos números. ¿Qué deben cumplir?', ok: 'Multiplicados dan 10 y sumados dan 7.', bad: ['Sumados dan 10 y multiplicados dan 7.', 'Multiplicados dan 7 y restados dan 10.', 'Deben ser los dos iguales.'] }],
  cubos: [{ q: '¿Cómo puedes comprobar que <b>(x + 2)(x² − 2x + 4) = x³ + 8</b>?', ok: 'Multiplicando: los términos intermedios se cancelan y quedan x³ y 8.', bad: ['Sumando 2 + 2 + 4.', 'Elevando (x + 2) al cuadrado.', 'Restando x³ − 8.'] }],
};
function g_comprende(r, lvl, opts) {
  const sk = (opts && opts.skill) || 'cuadrado';
  const list = WHY[sk] || WHY.cuadrado;
  const it = r.pick(list);
  const options = r.shuffle([{ h: it.ok, ok: true }].concat(it.bad.map((h) => ({ h, ok: false, fb: 'Piénsalo de nuevo: ' + it.ok, tag: 'otro' }))));
  return P({ kind: 'choice', dim: 'comprende', instr: 'Piensa en el porqué.', expr: '<div class="why">' + it.q + '</div>', options: options.map((o) => ({ ...o, h: esc2(o.h).replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>') })),
    hints: ['Recuerda de dónde sale cada término.', 'Piensa en el modelo de áreas o en abrir los paréntesis con calma.', 'Descarta las opciones que no explican el procedimiento.'],
    solution: [it.ok], answer: it.ok, fallbackTag: 'otro', fallback: 'Piensa en por qué funciona, no solo en qué hacer. ' + it.ok });
}

  if (at.pct < 70 && bad.length) {
    const ls = []; bad.forEach((s) => { const L = skillLesson(s); if (L && ls.indexOf(L) < 0) ls.push(L); });
    h += '<div class="card"><div class="lbl">LECCIONES PARA REPASAR</div>' + ls.map((L) => '<button class="node" data-act="lesson" data-id="' + L.id + '"><span class="ic">' + L.icon + '</span><span class="t">' + L.title + '</span></button>').join('') + '</div>';
  }
  h += '<button class="btn ghost" data-act="home">VOLVER A LA RUTA</button>';
  app.innerHTML = h;
};
function startTrain(idx) {
  const at = S.exams[idx]; const bad = at.q.filter((x) => !x.ok), seen = {}, steps = [];
  bad.forEach((x) => { const k = x.gen + x.level + JSON.stringify(x.opts || {}); if (seen[k]) return; seen[k] = 1; for (let i = 0; i < 2; i++) steps.push({ t: 'gen', ph: 'ENTRENAMIENTO · ' + (SKILLS[x.skill] ? SKILLS[x.skill].name : x.skill).toUpperCase(), gen: x.gen, level: Math.min(x.level, 2), opts: x.opts || {} }); });
  startRun({ kind: 'train', steps: steps.slice(0, 10) });
}

// ---------- Eventos globales ----------
const ACT = {
  start() { const n = $('#nm').value.trim(), d = $('#dt').value; if (!n) { $('#nm').focus(); $('#nm').style.borderColor = 'var(--bad)'; return; } S.name = n; if (d) S.exam = d; save(); S.placed = true; save(); go('home'); },
  home() { go('home'); },
  lesson(el) { startLesson(el.getAttribute('data-id')); },
  reto(el) { startLesson(el.getAttribute('data-id')); },
  quit() { go('home'); },
  errors() { go('errors'); },
  reviewStart() { startReview(); },
  examIntro() { go('examIntro'); },
  examStart() { S.draft = { seed: rnd() % 100000 + 1, idx: 0, answers: [], attempt: S.exams.length + 1 }; save(); go('exam'); },
  examResume() { go('exam'); },
  examExit() { go('home'); },
  examLast() { go('examResult', { idx: S.exams.length - 1 }); },
  trainErrors(el) { startTrain(+el.getAttribute('data-idx')); },
  reset1() { V.confirm = true; render(); },
  reset2() { S = fresh(); try { localStorage.removeItem(KEY); } catch (e) { /* nada */ } go('welcome'); },
};
document.addEventListener('click', (e) => { const a = e.target.closest('[data-act]'); if (a && ACT[a.getAttribute('data-act')]) ACT[a.getAttribute('data-act')](a, e); });

// ---------- Arranque ----------
window.__despeja = { whyNot, Core, get S() { return S; }, go, mountEx, Gen, Chk, examProblemSpec };
Object.keys(S.done).forEach((k) => { if (S.done[k] && S.done[k].fast) delete S.done[k]; });
go(S.name ? 'home' : 'welcome');

};
__req("app");
