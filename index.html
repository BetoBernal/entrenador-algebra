/* ══════════════════════════════════════════════════════════════
   ENTRENADOR DE ÁLGEBRA — Etapas 1 y 2
   Desarrollo del Pensamiento Algebraico (UANL)
   ══════════════════════════════════════════════════════════════ */

/* ---------- 1. MOTOR ALGEBRAICO ----------
   Convierte cualquier expresión escrita en un polinomio canónico.
   Sirve para validar respuestas escritas, no solo opción múltiple. */

const clave = vars => Object.keys(vars).filter(v => vars[v] !== 0).sort().map(v => vars[v] === 1 ? v : `${v}^${vars[v]}`).join("");
function nuevoPoly(term) {
  const p = new Map();
  if (term) p.set(term.k, term.c);
  return p;
}
function sumaPoly(a, b) {
  const r = new Map(a);
  b.forEach((c, k) => {
    const n = (r.get(k) || 0) + c;
    if (n === 0) r.delete(k);else r.set(k, n);
  });
  return r;
}
function negPoly(a) {
  const r = new Map();
  a.forEach((c, k) => r.set(k, -c));
  return r;
}
function mulPoly(a, b) {
  const r = new Map();
  a.forEach((ca, ka) => b.forEach((cb, kb) => {
    const k = mulClave(ka, kb),
      n = (r.get(k) || 0) + ca * cb;
    if (n === 0) r.delete(k);else r.set(k, n);
  }));
  return r;
}
function desglosa(k) {
  const m = {};
  const re = /([a-z])(?:\^(-?\d+))?/g;
  let x;
  while (x = re.exec(k)) m[x[1]] = (m[x[1]] || 0) + (x[2] ? parseInt(x[2]) : 1);
  return m;
}
function mulClave(a, b) {
  const m = desglosa(a);
  const n = desglosa(b);
  Object.keys(n).forEach(v => m[v] = (m[v] || 0) + n[v]);
  return clave(m);
}
function potPoly(a, n) {
  let r = nuevoPoly({
    k: "",
    c: 1
  });
  for (let i = 0; i < n; i++) r = mulPoly(r, a);
  return r;
}

/* división entre un monomio: coeficientes entre coeficientes, exponentes restados */
function divExacta(a, b) {
  if (b.size === 0) throw new Error("división entre cero");
  if (b.size !== 1) throw new Error("no se admite dividir entre un polinomio de varios términos");
  const [kb, cb] = [...b.entries()][0];
  if (cb === 0) throw new Error("división entre cero");
  const nb = desglosa(kb);
  const r = new Map();
  a.forEach((ca, ka) => {
    const na = desglosa(ka);
    Object.keys(nb).forEach(v => na[v] = (na[v] || 0) - nb[v]);
    r.set(clave(na), ca / cb);
  });
  return r;
}

/* analizador estricto: sintaxis válida, paréntesis balanceados y consumo total.

        factores: null

          prod: true,

function opciones(correcta, malas) {

    ok: true
  }];
  const agrega = (t, error) => {
    const s = String(t);
    if (s && s !== String(correcta) && !set.some(x => x.t === s) && set.length < 4) set.push({
      t: s,
      error,
      ok: false

  };

  if (set.length < 4) {
    const n = Number(correcta);
    const extra = Number.isFinite(n) ? [n + 1, n - 1, n + 2, n * 2, n - 2, -n].map(String) : [String(correcta) + "x", "Ninguna de las anteriores", "No se puede determinar"];

    const j = r(0, i);
    [set[i], set[j]] = [set[j], set[i]];
  }

}

function generarPlan(dias) {
  const n = Math.max(1, Math.min(14, dias));
  if (n >= 14) return PLAN_BASE.map((p, i) => ({
    ...p,
    dia: i + 1
  }));
  const grupos = Array.from({
    length: n
  }, () => []);
  PLAN_BASE.forEach((p, i) => grupos[Math.floor(i * n / PLAN_BASE.length)].push(p));

function muestraSimulacro(etapa, n) {
  const familias = etapa === 0 ? [...FAMILIAS[1], ...FAMILIAS[2]] : FAMILIAS[etapa];
  const elegidas = [];
  familias.forEach(([, sk]) => {
    const cuantas = sk.length >= 5 ? 3 : sk.length >= 3 ? 2 : 1;
    const barajado = [...sk].sort(() => Math.random() - 0.5);
    for (let i = 0; i < cuantas; i++) elegidas.push(barajado[i % barajado.length]);
  });
  const todas = familias.flatMap(([, sk]) => sk);
  while (elegidas.length < n) {
    const faltantes = todas.filter(x => !elegidas.includes(x));
    elegidas.push(faltantes.length ? pick(faltantes) : pick(todas));
  }
  return elegidas.slice(0, n).sort(() => Math.random() - 0.5);
}

function evaluarDiagnostico(items, respuestas) {

  let aciertos = 0;
  items.forEach(it => {
    const r = respuestas[it.uid];
    const s = skills[it.skill] || (skills[it.skill] = {
      ...skillVacio(it.skill)
    });
    s.intentos++;
    if (r && r.correcto) {
      aciertos++;
      s.aciertos++;
      s.puntaje = Math.min(100, s.puntaje + 55);
      s.racha = 1;
    } else {
      s.puntaje = Math.max(0, s.puntaje - 5);
      if (r && r.tipoError) {
        s.errores[r.tipoError] = (s.errores[r.tipoError] || 0) + 1;
        errores[r.tipoError] = (errores[r.tipoError] || 0) + 1;

    }
    s.ultima = hoy();
    s.proximo = hoy();
  });
  return {
    fecha: hoy(),

    total: items.length,
    pct: Math.round(aciertos / items.length * 100),
